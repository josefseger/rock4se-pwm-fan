name: ROCK 4SE PWM Fan
version: "1.1.2"
slug: rock4se_pwm_fan
description: Temperature-controlled PWM fan for Radxa ROCK 4SE using RK3399 PWM registers
url: https://github.com/josefseger/rock4se-pwm-fan
arch:
  - aarch64
startup: services
boot: auto
init: false
apparmor: false
protected: true
devices:
  - /dev/mem
privileged:
  - SYS_RAWIO
options:
  poll_seconds: 5
  min_speed: 25
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
schema:
  poll_seconds: int(2,60)
  min_speed: int(0,100)
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str
  mqtt_password: password
